- date: 1. September 2023
  headline: "AutPhi hires a graduate research assistant! **Benjamin Sidloski** is a Master's Student in the Philosophy Department at Dalhousie University. He completed his undergraduate degree in Psychology at the University of British Columbia in 2021, with research contributions to the fields of evolutionary psychology and the study of addictive behaviours. Sidloski's current research interests pertain to the intersection of philosophy of language and mind, and abnormal psychology/psychopathology. Welcome, Benjamin!"

- date: 1. September 2023
  headline: "AutPhi hires an undergraduate research assistant! **Alexis Amero** is an undergraduate student at the University of King's College working toward completing a BA (Hons.) in Philosophy at Dalhousie. Amero's research interests currently lie in Social Philosophy and Ethics, especially Feminism, Gender, and Sexuality Studies. Welcome, Alexis!"

