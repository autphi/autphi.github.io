- date: 1. May 2024
  headline: "AutPhi hires an undergraduate research assistant! **Kayla Marie Beals** recently completed a BA (Hons.) in Philosophy at Dalhousie University and was awarded an NSERC Undergraduate Student Research Award (USRA). Welcome, Kayla!"

- date: 1. May 2024
  headline: "AutPhi hires a graduate research assistant! **Derek Andrews** is a PhD candidate in the Philosophy Department at Dalhousie University. Andrews' doctoral research investigates the intersection between biological approaches to psychiatry, natural kinds, and the practice of utilizing statistical information about mental disorders to inform health care policy pertaining to those disorders, taking the 2022-23 Canadian ban on persons with mental illness(s) as their sole underlying condition accessing medical assistance in dying as a test case. Welcome, Derek!"

- date: 26. April 2024
  headline: "LaCroix and Amero co-present their paper, 'What do philosophers talk about when they talk about autism?' at the [*Dalhousie Philosophy Department Colloquium Series*](https://www.dal.ca/faculty/arts/philosophy.html) in Halifax, Nova Scotia."

- date: 5. April 2024
  headline: "LaCroix's paper on autism and the value-free ideal of science presented at the [*Dalhousie Philosophy Department Colloquium Series*](https://www.dal.ca/faculty/arts/philosophy.html) in Halifax, Nova Scotia."

- date: 1. February 2024
  headline: "LaCroix, Amero, and Sidloski's paper, 'What do philosophers talk about when they talk about autism?' accepted to the annual meeting of the [*Canadian Society for the History and Philosophy of Science*](https://cshps.ca/), to be held at the [Congress of the Humanities and Social Sciences](https://www.federationhss.ca/en/congress2024) in Montréal (June, 2024)."

